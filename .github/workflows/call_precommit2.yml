name: call-precommit
permissions: read-all

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version'
        type: string
        required: true
      gpu_enabled:
        description: 'Enable gpu tests'
        type: boolean
        default: false
        required: true
      override_requirements:
        description: 'Override requirements'
        default: ''
        type: string
        required: false

jobs: 
  pytorch-cpu:
    timeout-minutes: 40
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run : |
          sudo apt-get update
          sudo apt-get --assume-yes install gcc g++ build-essential ninja-build libgl1-mesa-dev libglib2.0-0
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
        with:
          lfs: true
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: ${{ inputs.python_version }}
      - name: Runner info
        continue-on-error: true
        run: |
          cat /etc/*release
          cat /proc/cpuinfo
      - name: Override constraints
        if: ${{ inputs.override_requirements != '' }}
        run: python .github/scripts/override_constraints.py "${{ inputs.override_requirements }}"
        shell: bash
      - name: Install NNCF and test requirements
        run: pip install . -r tests/torch/requirements.txt
      - name: Print installed modules
        run: pip list
      - name: Run PyTorch precommit test scope
        run: |
          pytest tests/torch/accuracy_aware_training/test_accuracy_aware_config.py::test_accuracy_aware_config[aa_config0-False]
          pytest tests/torch/accuracy_aware_training/test_accuracy_aware_config.py::test_accuracy_aware_config[aa_config1-True]
          pytest tests/torch/accuracy_aware_training/test_accuracy_aware_config.py::test_accuracy_aware_config[aa_config2-True]
          pytest tests/torch/accuracy_aware_training/test_accuracy_aware_config.py::test_accuracy_aware_config[aa_config3-False]
          pytest tests/torch/accuracy_aware_training/test_runner.py::test_runner[10-0.0005-0.78276]
          pytest tests/torch/accuracy_aware_training/test_training_loop.py::test_adaptive_compression_training_loop[max_accuracy_degradation0-0.745-0.998181]
          pytest tests/torch/accuracy_aware_training/test_training_loop.py::test_adaptive_compression_training_loop[max_accuracy_degradation1-0.92-0.0]
          pytest tests/torch/accuracy_aware_training/test_training_loop.py::test_adaptive_compression_training_loop[max_accuracy_degradation2-0.82-0.9151]
          pytest tests/torch/accuracy_aware_training/test_training_loop.py::test_adaptive_compression_training_loop_with_no_training[max_accuracy_degradation0-1-0.01]
          pytest tests/torch/accuracy_aware_training/test_training_loop.py::test_mock_dump_checkpoint[aa_config0]
          pytest tests/torch/composite/test_sparsity_quantization.py::test_can_quantize_inputs_for_sparsity_plus_quantization
